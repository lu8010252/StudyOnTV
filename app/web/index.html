<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#141414">
<title>题了个题 · 先学再看</title>
<link rel="stylesheet" href="assets/css/tv.css">
<link rel="stylesheet" href="assets/css/features.css">
</head>
<body>
<div class="bg"><div class="glow glow-a"></div><div class="glow glow-b"></div><div class="grain"></div></div>
<header class="topbar">
  <div class="brand"><span class="logo"><i></i></span><span class="brand-text">题了个题</span></div>
  <div class="topright"><span class="pill" id="topPill">正在连接…</span><span class="clock" id="clock"></span><span class="ver" id="ver"></span></div>
</header>
<div class="update-tip" id="updateTip"><span class="update-text" id="updateText"></span><button class="update-btn focusable" id="updateGo" data-action="update-go">更新</button><button class="update-close focusable" id="updateClose" data-action="update-close" aria-label="关闭">×</button></div>
<main id="stage">
  <section class="screen" id="screen-quiz">
    <div class="quiz-wrap">
      <div class="quiz-head"><div class="crumb"><span class="crumb-main" id="qMode">学习任务</span></div><div class="counter"><b id="qIndex">0</b><i id="qTotal"></i></div></div>
      <h1 class="question" id="qText">加载中…</h1>
      <div id="qMedia" class="question-media"></div>
      <div class="options" id="qOptions"></div>
      <div class="pool-status" id="qPool"></div>
      <div class="feedback" id="qFeedback" role="status" aria-live="polite"><div class="fb-icon" id="fbIcon"></div><div class="fb-body"><div class="fb-title" id="fbTitle"></div><div class="fb-answer" id="fbAnswer"></div><div class="fb-tip" id="fbTip"></div></div><button class="btn btn-primary focusable" id="fbNext" data-action="next">继续</button></div>
      <div class="quiz-foot"><div class="dots-progress" id="qDots"></div><div class="quiz-foot-right"><button class="btn btn-ghost focusable read-aloud-btn" id="readAloudBtn" data-action="read-aloud" style="display:none">朗读</button><div class="hint"><span class="kbd">◀ ▶ ▲ ▼</span><span class="hint-text">选择</span><span class="kbd">OK</span><span class="hint-text">确认</span><span class="kbd">返回</span><span class="hint-text">回到桌面</span></div></div></div>
    </div>
  </section>
  <section class="screen" id="screen-hub">
    <div class="hub-wrap">
      <div class="hub-top">
        <div class="hub-stats" id="hubStats">
          <span class="hub-stat hub-stat-streak" id="hubStreak">🔥 连续学习 0 天</span>
          <span class="hub-stat" id="hubToday">今日已练 0 题</span>
          <span class="hub-stat" id="hubMastered">已掌握 0 题</span>
        </div>
        <div class="hub-children" id="hubChildren"></div>
      </div>
      <div class="hub-heading">
        <h1 class="hub-title" id="hubTitle">自主学习中心</h1>
        <p class="hub-subtitle" id="hubSubtitle">挑一个喜欢的模式开始练习，错题清零、记忆更牢</p>
      </div>
      <div class="hub-grid" id="hubGrid">
        <button class="hub-card focusable" data-action="start-study" data-focus="due">
          <div class="hub-card-head"><span class="hub-card-emoji">⏰</span><span class="hub-card-badge" id="hubDueBadge">0 道到期</span></div>
          <div class="hub-card-title">今日记忆复习</div>
          <div class="hub-card-desc">艾宾浩斯间隔重复，在遗忘临界点及时巩固</div>
        </button>
        <button class="hub-card focusable" data-action="start-study" data-focus="wrong" data-memorize="1">
          <div class="hub-card-head"><span class="hub-card-emoji">📕</span><span class="hub-card-badge hub-badge-warn" id="hubWrongBadge">0 道错题</span></div>
          <div class="hub-card-title">错题先背再测</div>
          <div class="hub-card-desc">先看答案与解析背诵一遍，再立即闯关清零</div>
        </button>
        <button class="hub-card focusable" data-action="start-study" data-focus="memorize">
          <div class="hub-card-head"><span class="hub-card-emoji">🗂️</span><span class="hub-card-badge" id="hubCardBadge">闪卡速记</span></div>
          <div class="hub-card-title">闪卡背诵模式</div>
          <div class="hub-card-desc">先独立回想再翻面核对，四档记忆程度自评</div>
        </button>
        <button class="hub-card focusable" data-action="start-study" data-focus="quiz">
          <div class="hub-card-head"><span class="hub-card-emoji">🎯</span><span class="hub-card-badge">随时挑战</span></div>
          <div class="hub-card-title">闯关刷题练习</div>
          <div class="hub-card-desc">自由刷题自测，挑战更高连续答对纪录</div>
        </button>
      </div>
      <div class="hub-foot">
        <div class="hub-actions" id="hubActions"></div>
        <p class="hub-note" id="hubNote"></p>
      </div>
    </div>
  </section>
  <section class="screen" id="screen-lock">
    <div class="lock-wrap"><div class="lock-badge" id="lockIcon"></div><h1 class="lock-title" id="lockTitle"></h1><p class="lock-desc" id="lockDesc"></p><div class="lock-actions" id="lockActions"></div><p class="lock-note" id="lockNote"></p></div>
  </section>
  <section class="screen" id="screen-pair">
    <div class="pair-wrap">
      <div class="pair-copy">
        <p class="pair-eyebrow">家长管理</p>
        <h1 class="pair-title">用手机管理这台设备</h1>
        <ol class="pair-steps">
          <li><b>1</b>手机连接与这台设备相同的 WiFi</li>
          <li><b>2</b>用相机扫描二维码，或在浏览器打开<br><span class="pair-url" id="pairUrl"></span></li>
          <li><b>3</b>输入管理密码，即可设置规则、题库与批改</li>
        </ol>
        <div class="lock-actions"><button class="btn btn-primary focusable" data-action="quiz">返回答题</button><button class="btn btn-ghost focusable" data-action="permissions">权限设置</button><button class="btn btn-ghost focusable" data-action="password">修改密码</button></div>
      </div>
      <div class="qr-box" id="pairQr"></div>
    </div>
  </section>
</main>
<script src="assets/js/qrcode.min.js"></script>
<script src="assets/js/math.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
