name: Build APK

# 触发方式：① 手动运行  ② 推送 v* 标签（如 git tag v0.3.1 && git push --tags）
# 版本号取自 app/native/app/build.gradle.kts 的 versionName，APK 文件名和 Release 标题都带版本号
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: 安装 SDK 平台（用 runner 自带的 Android SDK）
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - name: 读取版本号
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/native/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: 构建 TV 版和手机/平板版
        working-directory: app/native
        run: gradle --no-daemon assembleTvDebug assembleMobileDebug
      - name: 重命名（带版本号）
        run: |
          V="${{ steps.ver.outputs.name }}"
          mkdir -p out
          cp app/native/app/build/outputs/apk/tv/debug/*.apk "out/StudyOnTV-Android-TV-v$V.apk"
          cp app/native/app/build/outputs/apk/mobile/debug/*.apk "out/StudyOnTV-Mobile-v$V.apk"
      - name: 发布到 Releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')   # 测试分支只编译，不发 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: StudyOnTV v${{ steps.ver.outputs.name }}
          body: |
            **版本 v${{ steps.ver.outputs.name }}**（应用内「积分同步」面板和电视页右上角也能看到版本号）

            **这一版（v0.7.4）**
            · 彻底修复家长后台「复制出题指令 / 复制 JSON 指令 / 接口说明」显示已复制但剪贴板是空的：补上原生复制桥（应用内 WebView 的网页剪贴板会假成功），网页端优先走原生
            · 家长后台右下角的「授权 / 管控 / 积分」三个悬浮按钮改成竖排靠右，不再一个孤零零在左边

            **v0.7.3**
            · 再修家长后台「复制出题指令 / 复制 JSON 指令 / 接口说明」点了显示已复制、实际没复制：改用上游的复制逻辑（以当前弹窗为挂载点，并校验选中内容不为空，失败如实提示）

            **v0.7.2**
            · 修复家长后台「复制出题指令 / 复制 JSON 指令」点了没反应：弹窗里复制失败的后备方案被弹窗抢走焦点，现在改成挂在弹窗内部

            **v0.7.1**
            · 答完题不再强行回桌面：直接回到刚才看的视频软件（之前先回桌面，视频软件被压到后面，内存紧张时被系统杀掉）
            · 同步上游 v0.3.19：更多机型的开机/亮屏/解锁自动拉起，每日组数用完后剩余时间的计算修正
            · 删掉我们自己的「AI 出题」，改用上游的（家长后台题库页的「AI 出题」，需要在 AI 设置里重新填一次接口地址和 Key）

            **v0.7.0 · 同步上游 chadyi/StudyOnTV v0.3.17**
            · 并入上游新功能：每日免费时长、管控时段、家长遥控（临时解锁 N 分钟 / 无限时解锁 / 立即锁定）、防卸载、拦截系统设置页、答题范围（科目 / 年级）、答题反馈条新界面、音频自动恢复、Watchdog 保活、节假日数据
            · 本仓库原来的「暂停管控」已并入上游的「家长遥控」，电视上输入页改用上游的方案
            · 保留我们自己的：星星屋积分同步、AI 出题、答对多次自动淘汰、一键授权、无障碍自愈、每分钟自唤醒、透明答题页
            · 更新检查只看本仓库的 Release；上游作者的蒲公英更新和 Bugly 崩溃上报已关闭，不会把上游的包推给你
            · 升级后请重新点一次「🔐 授权」

            **v0.6.2 · 答完题回去，视频软件不再被杀**
            · 答题/拦截页改用透明窗口主题：视频软件只是被暂停、仍算「可见应用」，内存紧张时系统最后才回收它，答完题回去能接着看

            **v0.6.1 · 后台保活加固**
            · 无障碍自愈：无障碍被系统杀掉/关掉后，应用每分钟自检并自动写回、重新绑定（需先在家长后台点一次「🔐 授权」，授权里新增了「无障碍自愈授权」）
            · 一键授权新增：允许后台运行（RUN_IN_BACKGROUND / RUN_ANY_IN_BACKGROUND）
            · 升级后请重新点一次「🔐 授权」，让新增的授权生效

            **v0.6.0**
            · 积分改成「答对一题固定加分」（默认 1 分），可在「⭐ 积分」里改成按星级加分
            · 抽题不再重复：没做过的题优先，做过的优先出最久没做的，同一轮不会出重复题
            · AI 出题更难、更不重复：新增「出题难度」档位（标准/提高/挑战），同一题型模板最多留 2 道，字面太像的丢弃，知识点轮流出
            · 同一道题连续答对 3 次（可调）自动淘汰；可在「🎛 管控」里恢复
            · （0.7.0 起「暂停管控」改用上游的「家长遥控」）
            · 「🎛 管控」里可设置抽题最低星级（默认 2 星起）

            **之前的功能**
            · 答题积分同步到星星屋，两边都能看到
            · AI 出题：题库快做完时自动调用 AI 补新题（出题后让 AI 不看答案重做一遍复核）
            · 一键授权：家长后台点「🔐 授权」，应用通过本机 ADB 给自己开使用情况/无障碍/后台运行
            · 锁屏出现时不再把系统设置当作安全区，孩子按设置键进不了设置去关无障碍
          files: out/*.apk
