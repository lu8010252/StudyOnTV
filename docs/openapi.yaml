openapi: 3.0.3
info:
  title: 题了个题 · 局域网 API
  version: 1.0.0
  description: |
    设备端局域网 HTTP API，默认监听 8099 端口（若被占用会回落到 8090，以 GET /api/hello 返回的 port 为准）。

    鉴权方式（除公开接口外，所有 /api/* 接口都需要其中一种）：
    - Authorization: Bearer <家长令牌>：POST /api/auth 用管理密码换取，默认 12 小时有效；勾选 remember 时 30 天。
    - X-Admin-Key: <管理密码>：直接携带管理密码，无需先换令牌。
    - Authorization: Bearer sotv_…：家庭自动化集成令牌，只能访问 /api/state、/api/device、/api/coverage（只读）和 /api/remote（控制）。
    - X-Device-Token: <设备令牌>：仅电视本机 WebView 可用，由原生桥方法 apiToken() 提供；/api/quiz/* 只接受这种本机设备访问。

    公开接口只有 GET /api/hello 和 POST /api/auth；静态页面（/、/admin/、/practice 等）不在本规范内。

    通用约定：
    - 请求体上限 24 MB，超出返回 413（text/plain）。
    - 集成令牌合计限流 240 次/分钟，超出返回 429。
    - 所有响应带 Access-Control-Allow-Origin: *；OPTIONS 请求统一返回 204。
    - 管理密码连续错误 5 次后需等待一分钟，期间返回 401。
    - 业务校验失败通常返回 400 {"error":"bad_request","message":"..."}，部分旧接口会以 200 返回 {"error":"..."}，已在对应接口说明。

    本文档只描述局域网内的设备接口；页面样式从 unpkg CDN 加载，打开文档时需能访问外网，API 本身完全在局域网内。
servers:
  - url: http://{host}:8099
    description: 设备上的局域网 HTTP 服务
    variables:
      host:
        default: 192.168.1.10
        description: 电视 / 平板在局域网中的 IP，可在家长面板的连接页看到
security:
  - adminToken: []
  - adminKey: []
tags:
  - name: system
    description: 设备发现、应用列表与系统设置入口
  - name: auth
    description: 家长登录、退出与修改管理密码
  - name: state
    description: 学习状态、当天统计、历史与学情分析
  - name: children
    description: 多孩子档案与当前孩子切换
  - name: config
    description: 学习规则、可用时段与节假日
  - name: questions
    description: 题库读写、筛选、暂停、删除与 AI 出题
  - name: quiz
    description: 学习端答题流程；仅电视本机设备令牌可调用
  - name: speech
    description: 朗读与语音识别设置
  - name: grading
    description: AI 批改设置与待批作答
  - name: banks
    description: 共享题库市场与自定义题库源
  - name: automation
    description: 远程题库同步与自动 AI 补题
  - name: device
    description: 设备信息、整机备份恢复、防卸载、桌面、启动图标与崩溃上报
  - name: integration
    description: 家庭自动化集成令牌与远程遥控
  - name: update
    description: 应用更新检查与更新源设置
  - name: logs
    description: 本机诊断日志查看、清空与导出
  - name: events
    description: 设备事件记录
paths:
  /api/hello:
    get:
      tags: [system]
      operationId: getHello
      summary: 设备基本信息（公开）
      description: 唯一免鉴权的数据接口，用于发现设备、确认端口和题库数量。
      security: []
      responses:
        '200':
          description: 设备信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hello'
  /api/auth:
    post:
      tags: [auth]
      operationId: login
      summary: 用管理密码换取令牌（公开）
      description: 连续错误 5 次后需等待一分钟；错误时返回 401。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: 管理密码错误或仍在冷却期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/apps:
    get:
      tags: [system]
      operationId: listApps
      summary: 可启动应用列表
      description: 家长面板用来挑选不计时白名单。Android 11+ 需要应用声明才能看到其他应用；最多返回 500 个。
      responses:
        '200':
          description: 应用列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/state:
    get:
      tags: [state]
      operationId: getState
      summary: 学习状态总览
      description: |
        规则、当天统计、题库数量、答题组数、复习统计、学习状态、孩子档案与朗读开关。
        集成令牌需要「只读」权限；家长令牌或 X-Admin-Key 不受此限。
      security:
        - adminToken: []
        - adminKey: []
        - deviceToken: []
        - integrationToken: []
      responses:
        '200':
          description: 状态总览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/children:
    get:
      tags: [children]
      operationId: listChildren
      summary: 孩子档案列表
      responses:
        '200':
          description: 孩子列表与当前孩子
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildrenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [children]
      operationId: createChild
      summary: 新增孩子档案
      description: 新档案会沿用当前规则；名字 1–12 字且不能重名，最多 8 个档案。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 12
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                required: [ok, child, items]
                properties:
                  ok:
                    type: boolean
                  child:
                    $ref: '#/components/schemas/Child'
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Child'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [children]
      operationId: renameChild
      summary: 重命名孩子档案
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id:
                  type: string
                name:
                  type: string
                  minLength: 1
                  maxLength: 12
      responses:
        '200':
          description: 重命名成功
          content:
            application/json:
              schema:
                type: object
                required: [ok, items]
                properties:
                  ok:
                    type: boolean
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Child'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/children/switch:
    post:
      tags: [children]
      operationId: switchChild
      summary: 切换当前孩子
      description: 切换前会先把尚未落库的观看时长记到原孩子名下。id 为空或不存在时返回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
      responses:
        '200':
          description: 切换结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildrenSwitchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/children/delete:
    post:
      tags: [children]
      operationId: deleteChild
      summary: 删除孩子档案
      description: 连同该孩子的学习记录、使用时长和复习进度一起删除，题库本身保留；第一个孩子不能删除。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildrenSwitchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/holidays:
    get:
      tags: [config]
      operationId: getHolidays
      summary: 读取缓存的法定节假日
      responses:
        '200':
          description: 节假日数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/holidays/sync:
    post:
      tags: [config]
      operationId: syncHolidays
      summary: 同步某年的法定节假日
      description: 依次尝试多个公开数据源，全部失败时回落到内置数据。失败不会抛 HTTP 错误，而是以 200 返回 {"error":"holiday_failed","message":"..."}。
      parameters:
        - name: year
          in: query
          required: false
          description: 年份，默认按设备当前时区取当年
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        '200':
          description: 同步结果或错误对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidaySyncResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/config:
    put:
      tags: [config]
      operationId: saveConfig
      summary: 保存学习规则
      description: |
        只提交需要修改的字段，未提交的字段保持原值。部分字段有范围校验（见 Config schema），越界返回 400。
        请求体不是合法 JSON 时以 200 返回 {"error":"bad_json"}。保存后会提升 config.version 并立即刷新门禁。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Config'
      responses:
        '200':
          description: 保存后的完整规则；请求体不是合法 JSON 时返回 {"error":"bad_json"}
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [config]
                    properties:
                      config:
                        $ref: '#/components/schemas/Config'
                  - $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/questions/generate:
    post:
      tags: [questions]
      operationId: generateQuestions
      summary: 用 AI 生成候选题（不直接入库）
      description: 使用「批改」里配置的 AI 服务生成候选题，只返回候选，由面板确认后再导入。失败以 200 返回 {"error":"generate_failed","message":"..."}。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateQuestionsRequest'
      responses:
        '200':
          description: 候选题目或错误对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateQuestionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/questions:
    get:
      tags: [questions]
      operationId: listQuestions
      summary: 分页读取题库
      description: |
        管理端用 limit/offset/search/bank/type/difficulty/subject/level/wrong 做服务端筛选和分页，
        返回 {items,total,offset,limit}。不传参数时保持旧行为：500 题、随机顺序。
        all=1 与 enabledOnly=false 等价，都会包含已暂停的题目。
      parameters:
        - name: all
          in: query
          required: false
          description: 传 1 时包含已暂停题目
          schema:
            type: string
            enum: ['1']
        - name: enabledOnly
          in: query
          required: false
          description: 传 false 时包含已暂停题目
          schema:
            type: string
            enum: ['true', 'false']
        - name: subject
          in: query
          required: false
          schema:
            type: string
        - name: level
          in: query
          required: false
          schema:
            type: string
        - name: bank
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: 同时搜索题干、解析、选项、科目和年级
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [single, multiple, boolean, text, subjective]
        - name: difficulty
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: wrong
          in: query
          required: false
          description: 传 1 时只返回最近一次答错的题
          schema:
            type: string
            enum: ['1']
        - name: sort
          in: query
          required: false
          description: random 随机（默认）、oldest 最早、diff/difficulty 难度、type 题型，其他值按最新
          schema:
            type: string
            enum: [random, oldest, diff, difficulty, type, newest]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50000
            default: 500
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [questions]
      operationId: importQuestions
      summary: 新增 / 修改单题，或批量导入
      description: |
        正文带 items 数组时批量导入，可选 skipDuplicates 按题干去重；
        否则按单题处理，带 id 时覆盖原题。单题校验失败会以 200 返回 {"error":"bad_question","message":"..."}；
        批量导入是整批事务，任何一题失败都会回滚并返回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/QuestionImportRequest'
                - $ref: '#/components/schemas/Question'
      responses:
        '200':
          description: 导入结果或单题校验错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionWriteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/questions/meta:
    get:
      tags: [questions]
      operationId: getQuestionMeta
      summary: 题库筛选项与计数
      description: 返回题库名、科目、年级列表，以及总数、启用、暂停、错题计数，不返回题目内容。
      responses:
        '200':
          description: 筛选项与计数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/coverage:
    get:
      tags: [questions]
      operationId: getCoverage
      summary: 答题覆盖统计
      description: |
        口径是「答对过一次」。返回总量、覆盖率、按题库分布，以及还没答对的题目样本。
        集成令牌需要「只读」权限。
      security:
        - adminToken: []
        - adminKey: []
        - deviceToken: []
        - integrationToken: []
      parameters:
        - name: sample
          in: query
          required: false
          description: 返回的未覆盖题目样本数量
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 覆盖统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/questions/pause:
    post:
      tags: [questions]
      operationId: pauseQuestions
      summary: 暂停 / 恢复题目
      description: enabled 默认 false，即不传时执行暂停。ids 需要 1–50000 个。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseRequest'
      responses:
        '200':
          description: 更新数量
          content:
            application/json:
              schema:
                type: object
                required: [ok, updated]
                properties:
                  ok:
                    type: boolean
                  updated:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/system-settings:
    post:
      tags: [system]
      operationId: openSystemSettings
      summary: 在设备上打开系统设置
      description: 逐级尝试打开原生设置页，失败时回落到应用详情页；返回是否成功。
      responses:
        '200':
          description: 打开结果
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/speech:
    get:
      tags: [speech]
      operationId: getSpeechSettings
      summary: 读取朗读与语音识别设置
      description: 云端密钥不会回显，只返回 azureKeySet / aliyunSecretSet / deepseekKeySet 标记。
      responses:
        '200':
          description: 朗读设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeechSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [speech]
      operationId: saveSpeechSettings
      summary: 保存朗读与语音识别设置
      description: 密钥留空表示保留已保存值；clearKeys=true 清空全部云端密钥。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechSettingsUpdate'
      responses:
        '200':
          description: 保存后的设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeechSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/bank-automation:
    get:
      tags: [automation]
      operationId: getBankAutomation
      summary: 读取远程题库与自动补题设置
      responses:
        '200':
          description: 自动化设置与运行状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAutomationSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [automation]
      operationId: saveBankAutomation
      summary: 保存远程题库与自动补题设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAutomationUpdate'
      responses:
        '200':
          description: 保存后的设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAutomationSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/banks/market:
    get:
      tags: [banks]
      operationId: getBankMarket
      summary: 读取共享题库市场
      description: 汇总所有题库源的索引；某个源拉取失败只会在 failed 里列出，不影响其他源。
      responses:
        '200':
          description: 题库市场
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankMarketResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/banks/sources:
    post:
      tags: [banks]
      operationId: addBankSource
      summary: 添加自定义题库源
      description: 公网地址必须使用 https；局域网地址可用 http。名称留空时取主机名，最多 20 个源。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankSourceRequest'
      responses:
        '200':
          description: 更新后的题库源列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankSourceList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [banks]
      operationId: removeBankSource
      summary: 移除自定义题库源
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  description: 要移除的题库源地址
      responses:
        '200':
          description: 更新后的题库源列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankSourceList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/banks/fetch:
    post:
      tags: [banks]
      operationId: fetchBank
      summary: 下载并解析一份题库 JSON
      description: 由设备端下载，避免老 WebView 的 TLS 兼容问题；data 可能是题目数组，也可能是含 items 的对象。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  description: 题库 JSON 地址
      responses:
        '200':
          description: 题库内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankFetchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/bank-automation/sync:
    post:
      tags: [automation]
      operationId: startBankAutomation
      summary: 启动后台同步 / 补题
      description: 立即启动一次后台任务；运行状态通过 GET /api/bank-automation 轮询。
      responses:
        '200':
          description: 当前设置与运行状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAutomationSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/questions/bank:
    delete:
      tags: [questions]
      operationId: deleteQuestionBank
      summary: 删除命名题库
      description: 必须传 confirm=true；删除后立即刷新门禁。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankDeleteRequest'
      responses:
        '200':
          description: 删除数量
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/questions/clear:
    post:
      tags: [questions]
      operationId: clearQuestions
      summary: 清空全部题库
      description: 必须传 confirm=true；包含暂停题，并清理题目进度。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearRequest'
      responses:
        '200':
          description: 删除数量
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/questions/delete:
    post:
      tags: [questions]
      operationId: deleteQuestions
      summary: 批量删除题目
      description: ids 需要 1–50000 个；如果删到的正是孩子手上那题，会立刻换题。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionDeleteRequest'
      responses:
        '200':
          description: 删除数量
          content:
            application/json:
              schema:
                type: object
                required: [ok, deleted]
                properties:
                  ok:
                    type: boolean
                  deleted:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/questions/{id}:
    delete:
      tags: [questions]
      operationId: deleteQuestion
      summary: 删除单题
      description: 未找到时也返回 200，只是 ok=false。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/history:
    get:
      tags: [state]
      operationId: getHistory
      summary: 最近几天的使用与答题统计
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
      responses:
        '200':
          description: 每日统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/events:
    get:
      tags: [events]
      operationId: listEvents
      summary: 近期设备事件
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: 事件列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/grading:
    get:
      tags: [grading]
      operationId: getGradingSettings
      summary: 读取批改设置
      description: 包含常用服务商预设；API Key 不会回显，只返回 hasKey。
      responses:
        '200':
          description: 批改设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradingSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [grading]
      operationId: saveGradingSettings
      summary: 保存批改设置
      description: apiKey 留空表示保留原值；clearKey=true 清空密钥。mode=ai 时会校验地址、模型和密钥。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradingSettingsUpdate'
      responses:
        '200':
          description: 保存后的设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradingSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/grading/test:
    post:
      tags: [grading]
      operationId: testGrading
      summary: 测试 AI 批改连通性
      description: 请求里的 endpoint / model / apiKey 可覆盖已保存值；失败也返回 200，ok=false。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradingDraft'
      responses:
        '200':
          description: 测试结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradingTestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/grading/models:
    post:
      tags: [grading]
      operationId: listGradingModels
      summary: 拉取服务商模型列表
      description: 失败也返回 200，ok=false 且 items 为空。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradingDraft'
      responses:
        '200':
          description: 模型列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradingModelsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/update:
    get:
      tags: [update]
      operationId: getUpdateStatus
      summary: 读取更新状态
      responses:
        '200':
          description: 更新状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [update]
      operationId: saveUpdateSettings
      summary: 保存更新源设置
      description: api 必须为空或 https；mirrors 最多 10 个且必须为 https；resetMirrors=true 恢复默认镜像。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettings'
      responses:
        '200':
          description: 保存后的更新状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/update/check:
    post:
      tags: [update]
      operationId: checkUpdate
      summary: 后台检查更新
      description: 检查可能依次尝试多个来源，接口立即返回当前状态；之后轮询 GET /api/update。
      responses:
        '200':
          description: 当前更新状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: 修改管理密码
      description: 当前密码错误返回 403；新密码需要 6–64 位。修改后已有家长令牌全部失效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, password]
              properties:
                current:
                  type: string
                  description: 当前管理密码
                password:
                  type: string
                  minLength: 6
                  maxLength: 64
                  description: 新管理密码
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 当前密码不正确（连续错误 5 次后需等待一分钟）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 退出当前家长令牌
      description: 使当前 Authorization 令牌失效；成功始终返回 ok=true。
      responses:
        '200':
          description: 已退出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/remote:
    post:
      tags: [integration]
      operationId: remoteControl
      summary: 远程解锁 / 暂停 / 调整今日余额
      description: |
        家长令牌（Authorization）或带「控制」权限的集成令牌可用；X-Admin-Key 和本机设备令牌不能调用。
        - unlock：临时解锁 1–1440 分钟，不扣学习余额，到点自动恢复规则。
        - lock：立即暂停；minutes=0 表示一直暂停到手动取消（最多 7 天）。
        - cancel：取消当前的临时解锁或暂停。
        - indefinite：持续关闭管控，直到手动取消。
        - credit：minutes 为 -480 到 480 的非零整数，调整今天奖励余额，不修改规则中的 dailyMinutes。
      security:
        - adminToken: []
        - integrationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoteRequest'
      responses:
        '200':
          description: 操作后的学习状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 没有家长登录，或集成令牌没有控制权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/integration:
    get:
      tags: [integration]
      operationId: getIntegrationState
      summary: 读取集成令牌状态
      responses:
        '200':
          description: 集成状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationState'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [integration]
      operationId: issueIntegrationToken
      summary: 生成集成令牌
      description: 新令牌会让旧令牌立即失效，明文只在本次响应返回一次。read 和 control 至少要选一个，否则以 200 返回 {"error":"bad_scope"}。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationIssueRequest'
      responses:
        '200':
          description: 新令牌与状态，或权限错误对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationIssueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [integration]
      operationId: updateIntegration
      summary: 修改集成开关与权限
      description: 只提交需要修改的字段；修改权限不会更换令牌。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationUpdateRequest'
      responses:
        '200':
          description: 更新后的状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [integration]
      operationId: revokeIntegration
      summary: 吊销集成令牌
      description: 旧令牌立即失效，同时关闭集成接口。
      responses:
        '200':
          description: 吊销后的状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationState'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/logs:
    get:
      tags: [logs]
      operationId: readLogs
      summary: 读取诊断日志
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 50
            maximum: 3000
            default: 800
        - name: q
          in: query
          required: false
          description: 按关键字过滤（不区分大小写）
          schema:
            type: string
      responses:
        '200':
          description: 日志行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [logs]
      operationId: clearLogs
      summary: 清空诊断日志
      responses:
        '200':
          description: 已清空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/logs/export:
    get:
      tags: [logs]
      operationId: exportLogs
      summary: 导出诊断日志 ZIP
      description: ZIP 内含日志文件、device.json 和 config.json。
      responses:
        '200':
          description: ZIP 文件
          headers:
            Content-Disposition:
              description: 附件文件名，形如 attachment; filename="studyontv-logs-YYYYMMDD-HHmm.zip"
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/device:
    get:
      tags: [device]
      operationId: getDevice
      summary: 设备信息与能力自检
      description: |
        设备名、版本、IP、端口、防卸载、电视桌面、开机自启、门禁诊断、时区、保活、Bugly 与崩溃上报状态。
        集成令牌需要「只读」权限。
      security:
        - adminToken: []
        - adminKey: []
        - deviceToken: []
        - integrationToken: []
      responses:
        '200':
          description: 设备信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [device]
      operationId: renameDevice
      summary: 修改设备名称
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 32
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                type: object
                required: [ok, name]
                properties:
                  ok:
                    type: boolean
                  name:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/device/crash:
    put:
      tags: [device]
      operationId: updateCrashUpload
      summary: 修改崩溃上报设置
      description: |
        consent 控制是否同意上传；endpoint 为空或 http(s) 地址；token 只写不读，留空表示不修改。
        响应不会回传 token 明文，只返回 hasToken。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrashSettingsRequest'
      responses:
        '200':
          description: 保存后的崩溃上报状态
          content:
            application/json:
              schema:
                type: object
                required: [ok, crashUpload]
                properties:
                  ok:
                    type: boolean
                  crashUpload:
                    $ref: '#/components/schemas/CrashUploadState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/device/bugly:
    put:
      tags: [device]
      operationId: updateBuglyConsent
      summary: 开启 / 关闭 Bugly 崩溃采集
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: 保存结果
          content:
            application/json:
              schema:
                type: object
                required: [ok, buglyConsent]
                properties:
                  ok:
                    type: boolean
                  buglyConsent:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/device/uninstall-guard:
    delete:
      tags: [device]
      operationId: disableUninstallGuard
      summary: 关闭防卸载
      description: 需要在设备上是设备管理员或设备所有者；失败返回 500。
      responses:
        '200':
          description: 已关闭
          content:
            application/json:
              schema:
