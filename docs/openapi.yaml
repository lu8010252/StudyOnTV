          properties:
            autoRead:
              type: boolean
    QuestionStats:
      type: object
      required: [presented, answered, correct, lastCorrect]
      properties:
        presented:
          type: integer
          description: 出题次数
        answered:
          type: integer
          description: 作答次数
        correct:
          type: integer
          description: 答对次数
        lastCorrect:
          type: boolean
          nullable: true
          description: null=从未作答；false=最近一次答错；true=最近一次答对
    Question:
      type: object
      additionalProperties: true
      required: [q]
      properties:
        id:
          type: string
          description: 题目 ID；再次提交同一 ID 会覆盖原题
        type:
          type: string
          enum: [single, multiple, boolean, text, subjective]
          default: single
        q:
          type: string
          minLength: 1
          maxLength: 5000
          description: 题干，纯文本，可用 $...$ / $$...$$ 公式
        a:
          type: array
          description: 选项，2–8 个；boolean 固定为 ["正确","错误"]
          minItems: 2
          maxItems: 8
          items:
            type: string
        k:
          type: integer
          description: 单选正确选项下标；判断题 0=正确、1=错误
        correctIndices:
          type: array
          description: 多选正确选项下标，必须全部选对
          items:
            type: integer
            minimum: 0
        answers:
          type: array
          description: 填空题可接受答案，至少一个
          items:
            type: string
        modelAnswer:
          type: string
          description: 主观题参考答案
        rubric:
          type: string
          description: 主观题评分标准
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
          default: 2
        tip:
          type: string
          description: 解析
        subject:
          type: string
          default: 常识
        level:
          type: string
          description: 年级，空字符串表示不限
        bank:
          type: string
          minLength: 1
          maxLength: 64
          default: 默认题库
        image:
          type: string
          description: 配图链接（http/https，或 data:image/... base64，≤500 KB）
        audio:
          type: string
          description: 音频链接（http/https）
        language:
          type: string
          enum: ['', zh-CN, zh-HK, zh-TW, en-US, en-GB]
          default: zh-CN
          description: 朗读语言，空字符串表示跟随系统
        enabled:
          type: boolean
          description: 是否启用；暂停的题不会出现在答题流程中
        stats:
          $ref: '#/components/schemas/QuestionStats'
    QuestionImportRequest:
      type: object
